name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mammomesh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unitaires et bout en bout)
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/mammomesh_test?sslmode=disable
          REDIS_URL_TEST: redis://localhost:6379/0
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -1

  web:
    name: Interface Nuxt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx nuxt typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Parcours navigateur (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mammomesh_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd backend && CGO_ENABLED=0 go build -o bin/mammomesh ./cmd/mammomesh
      - run: cd web && npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Parcours e2e
        working-directory: web
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mammomesh_e2e?sslmode=disable
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: web/playwright-report
          retention-days: 7

  images:
    name: Images Docker et compose
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - name: Secrets factices
        run: ./scripts/init-secrets.sh
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build api web
      - run: docker build deploy/backup
